<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Margin — journals & memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --font-body: 'Inter', system-ui, sans-serif;
    --font-serif: 'Newsreader', Georgia, serif;
    --r: 14px;
    --r-sm: 10px;
  }
  /* ---- Theme: Light (default) ---- */
  [data-theme="light"] {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface-2: #efece4;
    --fg: #211f1b;
    --dim: #8a877c;
    --line: rgba(33,31,27,0.10);
    --line-strong: rgba(33,31,27,0.18);
    --accent: #4f46a8;
    --accent-soft: #ece9fb;
    --j: #6d63cf;        /* journal accent */
    --j-soft: #efedfd;
    --m: #c8552b;        /* memory accent */
    --m-soft: #fbeae1;
    --ok: #2f7d5b;
    --shadow: 0 1px 2px rgba(33,31,27,0.04), 0 8px 24px rgba(33,31,27,0.05);
  }
  /* ---- Theme: Dark ---- */
  [data-theme="dark"] {
    --bg: #16140f;
    --surface: #211f19;
    --surface-2: #2a2820;
    --fg: #efece2;
    --dim: #908d80;
    --line: rgba(255,255,255,0.10);
    --line-strong: rgba(255,255,255,0.18);
    --accent: #b3aef0;
    --accent-soft: rgba(127,119,221,0.18);
    --j: #b3aef0;
    --j-soft: rgba(127,119,221,0.16);
    --m: #f0a07f;
    --m-soft: rgba(216,90,48,0.18);
    --ok: #6cc79b;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px rgba(0,0,0,0.35);
  }
  /* ---- Theme: Blue ---- */
  [data-theme="blue"] {
    --bg: #eaf1f9;
    --surface: #ffffff;
    --surface-2: #dde9f6;
    --fg: #0a2138;
    --dim: #5c7895;
    --line: rgba(10,33,56,0.10);
    --line-strong: rgba(10,33,56,0.18);
    --accent: #1c5fa3;
    --accent-soft: #d8e7f7;
    --j: #2f7fce;
    --j-soft: #dcebfb;
    --m: #b3760f;
    --m-soft: #fbeed2;
    --ok: #1f7d63;
    --shadow: 0 1px 2px rgba(10,33,56,0.05), 0 8px 24px rgba(10,33,56,0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    transition: background .35s ease, color .35s ease;
  }
  #root { height: 100%; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }
  ::selection { background: var(--accent-soft); }

  .app-shell {
    max-width: 760px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  @media (min-width: 800px) {
    .app-shell {
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }
  }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px 14px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark {
    font-family: var(--font-serif);
    font-weight: 500; font-size: 25px; letter-spacing: -.5px;
    color: var(--fg);
  }
  .brand .mark em { font-style: italic; color: var(--accent); }
  .brand .tag { font-size: 11px; color: var(--dim); letter-spacing: .04em; text-transform: uppercase; }

  .theme-switch { display: flex; gap: 4px; padding: 3px; background: var(--surface-2); border-radius: 999px; }
  .theme-switch button {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line);
    display: grid; place-items: center; background: transparent; padding: 0;
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .theme-switch button:hover { transform: translateY(-1px); }
  .theme-switch button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); border-color: transparent; }
  .sw-dot { width: 13px; height: 13px; border-radius: 50%; }

  /* ---------- content ---------- */
  .content { flex: 1; padding: 8px 22px 120px; }

  /* ---------- segmented filter ---------- */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 18px; }
  .filters button {
    font-size: 13px; padding: 7px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--dim);
    transition: all .18s ease;
  }
  .filters button:hover { border-color: var(--line-strong); color: var(--fg); }
  .filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  /* ---------- entry cards ---------- */
  .entry { padding: 18px 20px; margin-bottom: 14px; background: var(--surface); box-shadow: var(--shadow); position: relative; }
  .entry.journal { border-radius: 0 var(--r) var(--r) 0; border-left: 3px solid var(--j); }
  .entry.memory { border-radius: var(--r); border: 1px dashed var(--m); box-shadow: none; }
  .entry .head { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .kind-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .entry.journal .kind-dot { background: var(--j); }
  .entry.memory .kind-dot { background: var(--m); }
  .entry .when { font-size: 12px; color: var(--dim); }
  .entry .pill {
    margin-left: auto; font-size: 10.5px; font-weight: 500; padding: 3px 9px; border-radius: 999px;
    letter-spacing: .03em; text-transform: uppercase;
  }
  .entry.journal .pill { background: var(--j-soft); color: var(--j); }
  .entry.memory .pill { background: var(--m-soft); color: var(--m); }
  .entry .body { font-size: 15px; line-height: 1.62; color: var(--fg); }
  .entry.journal .body { font-family: var(--font-serif); font-size: 17px; line-height: 1.6; }
  .entry .sched {
    margin-top: 11px; font-size: 12px; color: var(--m); display: flex; align-items: center; gap: 6px;
  }
  .entry .photo {
    margin-top: 12px; height: 150px; border-radius: var(--r-sm);
    background: var(--surface-2); display: grid; place-items: center; color: var(--dim); font-size: 12px;
    background-size: cover; background-position: center;
  }
  .entry .mood { font-size: 12px; color: var(--dim); margin-left: 8px; }

  .empty { text-align: center; padding: 70px 20px; color: var(--dim); }
  .empty .ico { font-size: 30px; opacity: .5; }
  .empty p { margin-top: 12px; font-size: 14px; }
  .empty .serif { font-family: var(--font-serif); font-style: italic; font-size: 19px; color: var(--fg); margin-bottom: 6px; }

  /* ---------- FAB + bottom nav ---------- */
  .bottomnav {
    position: sticky; bottom: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-around;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
  }
  .bottomnav button {
    background: transparent; border: none; color: var(--dim);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 11px; padding: 6px 14px; border-radius: var(--r-sm);
    transition: color .15s ease;
  }
  .bottomnav button .ic { font-size: 21px; line-height: 1; }
  .bottomnav button[aria-current="true"] { color: var(--accent); }
  .bottomnav .addbtn {
    background: var(--accent); color: #fff; width: 50px; height: 50px; border-radius: 50%;
    align-items: center; justify-content: center; margin-top: -24px;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 45%, transparent);
    transition: transform .15s ease;
  }
  .bottomnav .addbtn:hover { transform: translateY(-2px); }
  .bottomnav .addbtn .ic { font-size: 26px; }

  /* ---------- sheet / modal ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.4);
    display: flex; align-items: flex-end; justify-content: center;
    animation: fade .2s ease;
  }
  @media (min-width: 640px) { .scrim { align-items: center; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(24px); opacity: .6; } }
  .sheet {
    width: 100%; max-width: 520px; background: var(--surface); color: var(--fg);
    border-radius: 22px 22px 0 0; padding: 22px 22px 28px; box-shadow: var(--shadow);
    animation: rise .26s cubic-bezier(.2,.7,.2,1);
    max-height: 92vh; overflow-y: auto;
  }
  @media (min-width: 640px) { .sheet { border-radius: 22px; } }
  .sheet h2 { font-family: var(--font-serif); font-weight: 500; font-size: 22px; margin-bottom: 4px; }
  .sheet .sub { font-size: 13px; color: var(--dim); margin-bottom: 18px; }
  .grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 0 auto 16px; }

  .choice {
    width: 100%; text-align: left; display: flex; align-items: center; gap: 16px;
    padding: 18px; border-radius: var(--r); border: 1px solid var(--line);
    background: var(--surface); margin-bottom: 12px; transition: all .18s ease;
  }
  .choice:hover { border-color: var(--line-strong); transform: translateX(2px); }
  .choice .ci { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
  .choice.j .ci { background: var(--j-soft); color: var(--j); }
  .choice.m .ci { background: var(--m-soft); color: var(--m); }
  .choice .t1 { font-size: 16px; font-weight: 500; }
  .choice .t2 { font-size: 13px; color: var(--dim); margin-top: 2px; }

  .field {
    width: 100%; min-height: 130px; padding: 14px; border-radius: var(--r);
    border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
    font-size: 15px; line-height: 1.55; resize: vertical; transition: border-color .15s;
  }
  .field:focus { outline: none; border-color: var(--accent); }
  .field.journal { font-family: var(--font-serif); font-size: 18px; font-style: italic; }

  .toolrow { display: flex; gap: 10px; margin: 14px 0; }
  .tool {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 12px 6px; border-radius: var(--r); border: 1px solid var(--line);
    background: var(--surface); color: var(--fg); font-size: 12px; transition: all .16s;
  }
  .tool:hover { border-color: var(--accent); }
  .tool .ti { font-size: 19px; }
  .tool.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .tool .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: #d8412f; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .moodrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
  .moodrow button {
    font-size: 19px; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface); transition: all .15s;
  }
  .moodrow button:hover { transform: scale(1.1); }
  .moodrow button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

  .btn-primary {
    width: 100%; padding: 15px; border-radius: var(--r); border: none;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 500;
    transition: filter .15s, transform .1s;
  }
  .btn-primary:hover { filter: brightness(1.07); }
  .btn-primary:active { transform: scale(.99); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-ghost {
    width: 100%; padding: 12px; border-radius: var(--r); margin-top: 10px;
    background: transparent; border: 1px solid var(--line); color: var(--dim); font-size: 14px;
  }
  .btn-ghost:hover { color: var(--fg); border-color: var(--line-strong); }

  /* ---------- share ---------- */
  .sharelist { margin-bottom: 8px; }
  .shareitem {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line);
    background: var(--surface); color: var(--fg); margin-bottom: 9px; transition: all .16s;
  }
  .shareitem:hover { border-color: var(--line-strong); }
  .shareitem .si { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 17px; background: var(--surface-2); }
  .shareitem.selected { border-color: var(--accent); background: var(--accent-soft); }
  .shareitem .chk { margin-left: auto; color: var(--accent); font-size: 17px; }
  .when-toggle { display: flex; gap: 8px; margin: 6px 0 14px; }
  .when-toggle button {
    flex: 1; padding: 11px; border-radius: var(--r); border: 1px solid var(--line);
    background: var(--surface); color: var(--dim); font-size: 13px; transition: all .16s;
  }
  .when-toggle button[aria-pressed="true"] { background: var(--m-soft); border-color: var(--m); color: var(--m); }
  .dt-input {
    width: 100%; padding: 13px; border-radius: var(--r); border: 1px solid var(--line);
    background: var(--surface-2); color: var(--fg); font-size: 14px; margin-bottom: 6px;
  }
  .dt-input:focus { outline: none; border-color: var(--accent); }
  .lbl { font-size: 12px; color: var(--dim); margin: 14px 0 6px; font-weight: 500; }

  /* ---------- calendar ---------- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 16px; }
  .cal-head h2 { font-family: var(--font-serif); font-weight: 500; font-size: 21px; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 16px; }
  .cal-nav button:hover { border-color: var(--line-strong); }
  .weekdays { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; margin-bottom: 6px; }
  .weekdays span { text-align: center; font-size: 11px; color: var(--dim); }
  .calgrid { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
  .day {
    aspect-ratio: 1; border-radius: var(--r-sm); display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 13px; color: var(--fg);
    border: 1px solid transparent; position: relative; background: transparent; transition: all .14s;
  }
  .day.has { background: var(--surface); border-color: var(--line); }
  .day.has:hover { border-color: var(--line-strong); }
  .day.blank { visibility: hidden; }
  .day.today { box-shadow: 0 0 0 2px var(--accent); }
  .day .dots { display: flex; gap: 3px; margin-top: 4px; height: 5px; }
  .day .dots i { width: 5px; height: 5px; border-radius: 50%; }
  .legend { display: flex; gap: 18px; margin-top: 18px; font-size: 12px; color: var(--dim); }
  .legend span { display: flex; align-items: center; gap: 7px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; }

  /* ---------- settings ---------- */
  .setting { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .setting:last-child { border-bottom: none; }
  .setting .stext { flex: 1; }
  .setting .stitle { font-size: 15px; }
  .setting .sdesc { font-size: 12.5px; color: var(--dim); margin-top: 2px; line-height: 1.4; }
  .toggle { width: 46px; height: 27px; border-radius: 999px; background: var(--line-strong); position: relative; border: none; flex-shrink: 0; transition: background .2s; }
  .toggle.on { background: var(--accent); }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .toggle.on::after { transform: translateX(19px); }
  .seg-mini { display: flex; gap: 6px; }
  .seg-mini button { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--dim); font-size: 12.5px; }
  .seg-mini button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ---------- auth ---------- */
  .auth-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 40px 28px; max-width: 420px; margin: 0 auto; width: 100%; }
  .auth-wrap .hero { font-family: var(--font-serif); font-size: 34px; font-weight: 500; line-height: 1.15; letter-spacing: -.5px; }
  .auth-wrap .hero em { font-style: italic; color: var(--accent); }
  .auth-wrap .lede { font-size: 15px; color: var(--dim); margin: 14px 0 30px; line-height: 1.55; }
  .auth-field { width: 100%; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 15px; margin-bottom: 12px; }
  .auth-field:focus { outline: none; border-color: var(--accent); }
  .auth-alt { text-align: center; font-size: 13px; color: var(--dim); margin-top: 18px; }
  .auth-alt button { background: none; border: none; color: var(--accent); font-size: 13px; text-decoration: underline; }
  .auth-demo { text-align: center; font-size: 12px; color: var(--dim); margin-top: 26px; line-height: 1.5; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: var(--fg); color: var(--bg); font-size: 13.5px; padding: 11px 18px;
    border-radius: 999px; z-index: 60; box-shadow: var(--shadow); animation: rise .25s ease;
    max-width: 90%;
  }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<body data-theme="light">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* =====================================================================
   DATA LAYER  (the only part that changes when wiring to Supabase)
   --------------------------------------------------------------------
   Every screen talks to `db.*` and never touches storage directly.
   Today this is an in-memory + localStorage store. To go live, replace
   each method body with a Supabase call — signatures stay identical.
   See the comments marked  SUPABASE:  for the real query each maps to.
   ===================================================================== */
const STORE_KEY = "margin.v1";

function seed() {
  const today = new Date();
  const iso = (d) => d.toISOString();
  const dayBack = (n) => { const d = new Date(today); d.setDate(d.getDate() - n); return d; };
  const future = (y) => { const d = new Date(today); d.setFullYear(d.getFullYear() + y); return d; };
  return {
    profile: { id: "u_demo", display_name: "You", theme: "light", merge_letters: true },
    entries: [
      { id: "e1", kind: "journal", body: "First full night of sleep in weeks. I keep watching her chest rise and fall, thinking how I'll tell her about these early days someday.", mood: "🥹", entry_date: iso(dayBack(0)), created_at: iso(dayBack(0)), photo: false },
      { id: "e2", kind: "memory", body: "For your eighteenth birthday, my love. The day we brought you home it rained the whole drive, and your dad sang to you the entire way.", mood: "❤️", entry_date: iso(dayBack(0)), created_at: iso(dayBack(0)), photo: true,
        scheduled: { channel: "whatsapp", recipient: "Future you", deliver_at: iso(future(16)), status: "pending" } },
      { id: "e3", kind: "journal", body: "Learned that bisection search halves the problem every step. Felt like a small superpower in maths class today.", mood: "🤓", entry_date: iso(dayBack(2)), created_at: iso(dayBack(2)), photo: false },
      { id: "e4", kind: "memory", body: "The little ramen place by the station finally reopened. Saving you a seat here for when you visit, mi amor.", mood: "🍜", entry_date: iso(dayBack(3)), created_at: iso(dayBack(3)), photo: true,
        scheduled: { channel: "whatsapp", recipient: "Sofía", deliver_at: iso(dayBack(3)), status: "sent" } },
      { id: "e5", kind: "journal", body: "Quiet Sunday. Tea, rain on the window, nowhere to be. Noting it down so I remember that ordinary days can feel like enough.", mood: "🌧️", entry_date: iso(dayBack(6)), created_at: iso(dayBack(6)), photo: false },
    ],
  };
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const s = seed();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
  return s;
}

let _state = load();
const _save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(_state)); } catch (e) {} };
const uid = () => "e" + Math.random().toString(36).slice(2, 9);

const db = {
  // SUPABASE: supabase.auth.getUser() + select from profiles
  getProfile() { return { ..._state.profile }; },

  // SUPABASE: update profiles set ... where id = auth.uid()
  updateProfile(patch) { _state.profile = { ..._state.profile, ...patch }; _save(); return this.getProfile(); },

  // SUPABASE: select * from entries where author_id = auth.uid()  (RLS handles privacy)
  //           + entries shared with me via scheduled_shares
  listEntries() { return _state.entries.slice().sort((a,b) => new Date(b.created_at) - new Date(a.created_at)); },

  // SUPABASE: insert into entries (...) ; if scheduled, insert into scheduled_shares
  addEntry(e) {
    const row = { id: uid(), created_at: new Date().toISOString(), entry_date: new Date().toISOString(), ...e };
    _state.entries.unshift(row); _save(); return row;
  },

  // SUPABASE: delete from entries where id = $1 and author_id = auth.uid()
  removeEntry(id) { _state.entries = _state.entries.filter(e => e.id !== id); _save(); },
};

/* ---- voice transcription stub ----
   SUPABASE: upload audio to storage → invoke `transcribe` edge function → returns text.
   Here we return a canned line after a short delay so the flow is demonstrable offline. */
function transcribeStub() {
  const lines = [
    "Walked the long way home tonight just to stretch the day out a little.",
    "She said her first proper word today and I cried in the kitchen.",
    "Note to future me: you were braver than you felt this week.",
  ];
  return new Promise((res) => setTimeout(() => res(lines[Math.floor(Math.random()*lines.length)]), 1400));
}

function fmtWhen(iso) {
  const d = new Date(iso), now = new Date();
  const days = Math.round((now - d) / 86400000);
  if (days === 0) return "Today";
  if (days === 1) return "Yesterday";
  if (days > 1 && days < 7) return days + " days ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function fmtFuture(iso) {
  const d = new Date(iso);
  const yrs = d.getFullYear() - new Date().getFullYear();
  if (yrs >= 1) return "scheduled for " + d.getFullYear();
  return "scheduled for " + d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

/* ---------------- Feed ---------------- */
function Feed({ entries }) {
  const [filter, setFilter] = useState("all");
  const shown = entries.filter((e) => {

  return (

/* ---------------- Calendar ---------------- */
function Calendar({ entries, merge }) {
  const [cursor, setCursor] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  const [scope, setScope] = useState(merge ? "merged" : "mine");
  useEffect(() => { setScope(merge ? "merged" : "mine"); }, [merge]);

  const monthName = new Date(cursor.y, cursor.m).toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const first = new Date(cursor.y, cursor.m, 1).getDay();
  const days = new Date(cursor.y, cursor.m + 1, 0).getDate();
  const today = new Date();

  const marks = useMemo(() => {
    const map = {};
    entries.forEach((e) => {
      const d = new Date(e.entry_date);
      if (d.getFullYear() !== cursor.y || d.getMonth() !== cursor.m) return;
      const isMine = e.kind === "journal";
      const isShared = e.kind === "memory";
      if (scope === "mine" && !isMine) return;
      if (scope === "shared" && !isShared) return;
      const day = d.getDate();
      map[day] = map[day] || { j: false, m: false };
      if (isMine) map[day].j = true; else map[day].m = true;
    });
    return map;
  }, [entries, cursor, scope]);

  const move = (dir) => setCursor((c) => {
    let m = c.m + dir, y = c.y;
    if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
    return { y, m };
  });

  const cells = [];
  for (let i = 0; i < first; i++) cells.push(<div key={"b"+i} className="day blank" />);
  for (let d = 1; d <= days; d++) {
    const mk = marks[d];
    const isToday = d === today.getDate() && cursor.m === today.getMonth() && cursor.y === today.getFullYear();
    cells.push(
      <div key={d} className={"day " + (mk ? "has " : "") + (isToday ? "today" : "")}>
        {d}
        <div className="dots">
          {mk && mk.j && <i style={{background:"var(--j)"}} />}
          {mk && mk.m && <i style={{background:"var(--m)"}} />}
        </div>
      </div>
    );
  }

  const scopes = [["merged","Merged"],["mine","Mine"],["shared","Shared"]];
  return (
    <div>
      <div className="filters">
        {scopes.map(([id,l]) => <button key={id} aria-pressed={scope===id} onClick={() => setScope(id)}>{l}</button>)}
      </div>
      <div className="cal-head">
        <h2>{monthName}</h2>
        <div className="cal-nav">
          <button onClick={() => move(-1)} aria-label="Previous month">‹</button>
          <button onClick={() => move(1)} aria-label="Next month">›</button>
        </div>
      </div>
      <div className="weekdays">{["S","M","T","W","T","F","S"].map((d,i) => <span key={i}>{d}</span>)}</div>
      <div className="calgrid">{cells}</div>
      <div className="legend">
        <span><i style={{background:"var(--j)"}} /> Journal</span>
        <span><i style={{background:"var(--m)"}} /> Memory</span>
      </div>
    </div>
  );
}

/* ---------------- Compose flow ---------------- */
function Compose({ onClose, onSaved, toast }) {
  const [step, setStep] = useState("pick");     // pick → write → share
  const [kind, setKind] = useState(null);        // journal | memory
  const [body, setBody] = useState("");
  const [mood, setMood] = useState(null);
  const [photo, setPhoto] = useState(false);
  const [recording, setRecording] = useState(false);
  const [transcribing, setTranscribing] = useState(false);

  // share state
  const [channels, setChannels] = useState([]);
  const [recipient, setRecipient] = useState("");
  const [when, setWhen] = useState("now");
  const [dt, setDt] = useState(() => {
    const d = new Date(); d.setFullYear(d.getFullYear() + 1);
    return d.toISOString().slice(0,16);
  });

  const isJ = kind === "journal";

  const startWrite = (k) => { setKind(k); setStep("write"); };

  const toggleRecord = async () => {
    if (recording || transcribing) return;
    setRecording(true);
    // SUPABASE/native: real version records mic audio via MediaRecorder, uploads, then transcribes.
    setTimeout(async () => {
      setRecording(false); setTranscribing(true);
      const text = await transcribeStub();
      setBody((b) => (b ? b + " " : "") + text);
      setTranscribing(false);
      toast("Voice note transcribed");
    }, 1600);
  };

  const saveJournal = () => {
    onSaved(db.addEntry({ kind: "journal", body: body.trim(), mood, photo }));
    toast("Saved to your journal");
    onClose();
  };

  const toggleChannel = (id) => setChannels((c) => c.includes(id) ? c.filter(x => x!==id) : [...c, id]);

  const confirmShare = () => {
    const ch = channels[0] || "link";
    const scheduled = {
      channel: ch,
      recipient: recipient.trim() || "a loved one",
      deliver_at: when === "now" ? new Date().toISOString() : new Date(dt).toISOString(),
      status: when === "now" ? "sent" : "pending",
    };
    onSaved(db.addEntry({ kind: "memory", body: body.trim(), mood, photo, scheduled }));
    if (when === "now") {
      // native: share sheet (navigator.share) hands off to the chosen app
      if (navigator.share && ch !== "link") {
        navigator.share({ text: body.trim() }).catch(() => {});
      }
      toast("Memory shared");
    } else {
      toast("Memory scheduled for " + new Date(dt).toLocaleDateString());
    }
    onClose();
  };

  return (
    <div className="scrim" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="sheet" role="dialog" aria-modal="true">
        <div className="grab" />

        {step === "pick" && (
          <div>
            <h2>What would you like to add?</h2>
            <p className="sub">Choose how this piece should live.</p>
            <button className="choice j" onClick={() => startWrite("journal")}>
              <span className="ci">🔒</span>
              <span><div className="t1">Write a journal</div><div className="t2">Private — just for you</div></span>
            </button>
            <button className="choice m" onClick={() => startWrite("memory")}>
              <span className="ci">✉️</span>
              <span><div className="t1">Note a memory</div><div className="t2">Sharable — now or in the future</div></span>
            </button>
            <button className="btn-ghost" onClick={onClose}>Cancel</button>
          </div>
        )}

        {step === "write" && (
          <div>
            <h2>{isJ ? "Dear diary" : "A memory to keep"}</h2>
            <p className="sub">{isJ ? "Only you will ever read this." : "You'll choose who receives it next."}</p>
            <textarea
              className={"field " + (isJ ? "journal" : "")}
              placeholder={isJ ? "Pour it out…" : "Capture this moment…"}
              value={body} onChange={(e) => setBody(e.target.value)} autoFocus
            />
            <div className="toolrow">
              <button className={"tool " + (recording || transcribing ? "active" : "")} onClick={toggleRecord}>
                {recording ? <span className="rec-dot" /> : <span className="ti">🎙️</span>}
                {recording ? "Listening…" : transcribing ? "Transcribing…" : "Voice to text"}
              </button>
              <button className={"tool " + (photo ? "active" : "")} onClick={() => setPhoto((p) => !p)}>
                <span className="ti">🖼️</span>{photo ? "Photo added" : "Add photo"}
              </button>
            </div>
            <div className="lbl">Mood (optional)</div>
            <div className="moodrow">
              {MOODS.map((m) => (
                <button key={m} aria-pressed={mood===m} onClick={() => setMood(mood===m ? null : m)}>{m}</button>
              ))}
            </div>
            {isJ ? (
              <button className="btn-primary" disabled={!body.trim()} onClick={saveJournal}>Save to journal</button>
            ) : (
              <button className="btn-primary" disabled={!body.trim()} onClick={() => setStep("share")}>Continue to share</button>
            )}
            <button className="btn-ghost" onClick={() => setStep("pick")}>Back</button>
          </div>
        )}

        {step === "share" && (
          <div>
            <h2>Share this memory</h2>
            <p className="sub">Send it now, or schedule it to arrive in the future.</p>
            <div className="sharelist">
              {CHANNELS.map((c) => (
                <button key={c.id} className={"shareitem " + (channels.includes(c.id) ? "selected" : "")} onClick={() => toggleChannel(c.id)}>
                  <span className="si">{c.ico}</span>
                  <span>{c.label}</span>
                  {channels.includes(c.id) && <span className="chk">✓</span>}
                </button>
              ))}
            </div>
            <div className="lbl">Recipient</div>
            <input className="dt-input" placeholder="Name, number, or email" value={recipient} onChange={(e) => setRecipient(e.target.value)} />
            <div className="lbl">When should it arrive?</div>
            <div className="when-toggle">
              <button aria-pressed={when==="now"} onClick={() => setWhen("now")}>Now</button>
              <button aria-pressed={when==="later"} onClick={() => setWhen("later")}>Schedule for later</button>
            </div>
            {when === "later" && (
              <input className="dt-input" type="datetime-local" value={dt} onChange={(e) => setDt(e.target.value)} />
            )}
            <button className="btn-primary" disabled={channels.length===0} onClick={confirmShare}>
              {when === "now" ? "Share now" : "Schedule memory"}
            </button>
            <button className="btn-ghost" onClick={() => setStep("write")}>Back</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------- Auth ---------------- */

  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  return (
    <div className="app-shell">
      <div className="topbar">
        <div className="brand"><span className="mark">M<em>a</em>rgin</span></div>
        <ThemeSwitch theme={theme} setTheme={setTheme} />
      </div>

/* ---------------- Theme switch ---------------- */
function ThemeSwitch({ theme, setTheme }) {
  return (
    <div className="theme-switch" role="group" aria-label="Theme">
      {THEMES.map((t) => (
        <button key={t.id} aria-pressed={theme===t.id} aria-label={t.id + " theme"}
          onClick={() => setTheme(t.id)} style={theme===t.id ? {boxShadow:`0 0 0 2px ${t.ring}`} : {}}>
          <span className="sw-dot" style={{background:t.dot, border: t.id==="light" ? "1px solid rgba(0,0,0,.12)" : "none"}} />
        </button>
      ))}
    </div>
  );
}

/* ---------------- Root ---------------- */
function App() {
  const [authed, setAuthed] = useState(false);
  const [profile, setProfile] = useState(() => db.getProfile());
  const [theme, setThemeState] = useState(profile.theme || "light");
  const [tab, setTab] = useState("feed");
  const [entries, setEntries] = useState(() => db.listEntries());
  const [composing, setComposing] = useState(false);
  const [toastMsg, setToastMsg] = useState(null);

  useEffect(() => { document.body.setAttribute("data-theme", theme); }, [theme]);

  const setTheme = useCallback((t) => {
    setThemeState(t);
    setProfile(db.updateProfile({ theme: t }));
  }, []);

  const toast = useCallback((m) => {
    setToastMsg(m);
    setTimeout(() => setToastMsg(null), 2400);
  }, []);

  const refresh = () => setEntries(db.listEntries());
  const changeProfile = (patch) => setProfile(db.updateProfile(patch));

  if (!authed) return <Auth onAuth={() => setAuthed(true)} theme={theme} setTheme={setTheme} />;

  const titles = { feed: "Entries", calendar: "Calendar", settings: "Settings" };

  return (
    <div className="app-shell">
      <div className="topbar">
        <div className="brand">
          <span className="mark">M<em>a</em>rgin</span>
          <span className="tag">{titles[tab]}</span>
        </div>
        <ThemeSwitch theme={theme} setTheme={setTheme} />
      </div>

      <div className="content">
        {tab === "feed" && <Feed entries={entries} />}
        {tab === "calendar" && <Calendar entries={entries} merge={profile.merge_letters} />}
        {tab === "settings" && <Settings profile={profile} onChange={changeProfile} theme={theme} setTheme={setTheme} />}
      </div>

      <nav className="bottomnav">
        <button aria-current={tab==="feed"} onClick={() => setTab("feed")}>
          <span className="ic">📖</span>Entries
        </button>
        <button aria-current={tab==="calendar"} onClick={() => setTab("calendar")}>
          <span className="ic">🗓️</span>Calendar
        </button>
        <button className="addbtn" onClick={() => setComposing(true)} aria-label="Add entry">
          <span className="ic">+</span>
        </button>
        <button aria-current={tab==="settings"} onClick={() => setTab("settings")}>
          <span className="ic">⚙️</span>Settings
        </button>
        <button onClick={() => { setAuthed(false); }} aria-label="Sign out">
          <span className="ic">↩︎</span>Sign out
        </button>
      </nav>

      {composing && <Compose onClose={() => setComposing(false)} onSaved={refresh} toast={toast} />}
      {toastMsg && <div className="toast">{toastMsg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
